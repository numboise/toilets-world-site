<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toilets World</title>
  <style>
    :root {
      --bg: #0d2345;
      --panel: #ffffff;
      --text: #152033;
      --muted: #5e6b80;
      --accent: #2f6df6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0b1d3a 0%, var(--bg) 100%);
      color: var(--text);
    }
    main {
      width: min(760px, 100%);
      background: var(--panel);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2.2rem;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.7;
    }
    .links {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    a {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      color: white;
      background: var(--accent);
    }
    a.secondary {
      background: #edf3ff;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Toilets World</h1>
    <p>Pages publiques utiles pour App Store Connect.</p>
    <div class="links">
      <a href="support.html">Support</a>
      <a class="secondary" href="privacy.html">Politique de confidentialite</a>
    </div>
  </main>
</body>
</html>
